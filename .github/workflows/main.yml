name: Build DoomC0re

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository (includes src/, Makefile, etc.)
      uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          make \
          python3 \
          xxd \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libsdl2-dev \
          libsdl2-mixer-dev \
          libsdl2-net-dev \
          gcc-x86-64-linux-gnu \
          binutils-x86-64-linux-gnu
        # Create x86_64-elf-* symlinks
        sudo ln -sf /usr/bin/x86_64-linux-gnu-gcc /usr/local/bin/x86_64-elf-gcc
        sudo ln -sf /usr/bin/x86_64-linux-gnu-ld /usr/local/bin/x86_64-elf-ld
        sudo ln -sf /usr/bin/x86_64-linux-gnu-objcopy /usr/local/bin/x86_64-elf-objcopy

    - name: Clone and configure Chocolate Doom (for headers)
      run: |
        git clone https://github.com/chocolate-doom/chocolate-doom.git third_party/chocolate-doom
        cd third_party/chocolate-doom
        ./autogen.sh
        ./configure --prefix=/usr --disable-shared --enable-static
        make config.h
        # Remove unused game folders (optional)
        rm -rf src/heretic src/hexen src/strife

    - name: Build DoomC0re payload
      run: |
        echo "Building DoomC0re..."
        make
        echo "Build complete!"

    - name: Verify outputs
      run: |
        ls -lah
        file doom.elf doom.bin || true
        wc -c doom.bin

    - name: Convert doom.bin to Lua hex (optional)
      run: |
        python3 -c "
        with open('doom.bin', 'rb') as f:
            data = f.read()
        hex_str = data.hex().upper()
        lines = [hex_str[i:i+64] for i in range(0, len(hex_str), 64)]
        lua_str = '\"' + '\"\n\"'.join(lines) + '\"'
        with open('doom_hex.txt', 'w') as f:
            f.write(lua_str)
        "
        echo "Hex string length: $(wc -c < doom_hex.txt) characters"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DoomC0re-Build
        path: |
          doom.bin
          doom.elf
          doom_hex.txt
          lua/doom.lua
          tools/convert_to_hex.py
          tools/send_lua.py
          linker.ld
          Makefile
          src/
        if-no-files-found: error
