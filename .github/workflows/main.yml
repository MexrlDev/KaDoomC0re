name: Build DoomC0re

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          make \
          python3 \
          xxd \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libsdl2-dev \
          libsdl2-mixer-dev \
          libsdl2-net-dev \
          gcc-x86-64-linux-gnu \
          binutils-x86-64-linux-gnu
        sudo ln -sf /usr/bin/x86_64-linux-gnu-gcc /usr/local/bin/x86_64-elf-gcc
        sudo ln -sf /usr/bin/x86_64-linux-gnu-ld /usr/local/bin/x86_64-elf-ld
        sudo ln -sf /usr/bin/x86_64-linux-gnu-objcopy /usr/local/bin/x86_64-elf-objcopy

    - name: Clone and configure Chocolate Doom
      run: |
        git clone https://github.com/chocolate-doom/chocolate-doom.git third_party/chocolate-doom
        cd third_party/chocolate-doom
        ./autogen.sh
        ./configure --prefix=/usr --disable-shared --enable-static
        make config.h
        rm -rf src/heretic src/hexen src/strife

    - name: Create project source files
      run: |
        mkdir -p src tools lua

    - name: Write all source files (platform layer + stubs)
      run: |
        # -----------------------------------------------------------------
        # core.h – unchanged
        cat > src/core.h << 'EOF'
        /* core.h - Common types and helpers */
        #ifndef CORE_H
        #define CORE_H
        typedef unsigned long  u64;
        typedef unsigned int   u32;
        typedef unsigned short u16;
        typedef unsigned char  u8;
        typedef long           s64;
        typedef int            s32;
        typedef short          s16;
        typedef signed char    s8;
        #define GADGET_OFFSET    0x31AA9
        #define LIBKERNEL_HANDLE 0x2001
        #define EBOOT_GS_THREAD  0x057F89B0
        #define EBOOT_VIDOUT     0x02d695d0
        #define SCR_W       1920
        #define SCR_H       1080
        #define FB_SIZE     (SCR_W * SCR_H * 4)
        #define FB_ALIGNED  ((FB_SIZE + 0x1FFFFF) & ~0x1FFFFF)
        #define FB_TOTAL    (FB_ALIGNED * 2)
        struct ext_args {
            s64 status;
            s64 step;
            u32 frame_count;
            u32 _pad;
            s32 log_fd;
            s32 pad_fd;
            u8  log_addr[16];
            u64 dbg[8];
        };
        __attribute__((naked))
        static u64 native_call(void *gadget, void *fn,
                               u64 a1, u64 a2, u64 a3,
                               u64 a4, u64 a5, u64 a6) {
            __asm__ volatile (
                "pushq %%rbx\n\t"
                "movq %%rsi, %%rbx\n\t"
                "movq %%rdi, %%rax\n\t"
                "movq %%rdx, %%rdi\n\t"
                "movq %%rcx, %%rsi\n\t"
                "movq %%r8,  %%rdx\n\t"
                "movq %%r9,  %%rcx\n\t"
                "movq 16(%%rsp), %%r8\n\t"
                "movq 24(%%rsp), %%r9\n\t"
                "callq *%%rax\n\t"
                "popq %%rbx\n\t"
                "retq" ::: "memory"
            );
        }
        static void *resolve_sym(void *gadget, void *dlsym_fn, s32 handle, const char *name) {
            void *addr = 0;
            native_call(gadget, dlsym_fn, (u64)handle, (u64)name, (u64)&addr, 0, 0, 0);
            return addr;
        }
        #define NC native_call
        #define SYM resolve_sym
        #define NULL 0
        #endif
        EOF

        # -----------------------------------------------------------------
        # hijack.h – unchanged
        cat > src/hijack.h << 'EOF'
        #ifndef HIJACK_H
        #define HIJACK_H
        #include "core.h"
        struct video_ctx {
            void *G, *D;
            void *vid_open, *vid_close, *vid_reg, *vid_flip, *vid_rate, *vid_evt;
            s32   handle;
            u64   eq;
            void *vmem;
            void *fbs[2];
        };
        int video_hijack(struct video_ctx *v, void *G, void *D, u64 eboot_base, struct ext_args *ext);
        void video_cleanup(struct video_ctx *v);
        void video_flip(struct video_ctx *v, int active);
        #endif
        EOF

        # -----------------------------------------------------------------
        # hijack.c – unchanged
        cat > src/hijack.c << 'EOF'
        #include "hijack.h"
        int video_hijack(struct video_ctx *v, void *G, void *D, u64 eboot_base, struct ext_args *ext) {
            v->G = G; v->D = D;
            v->handle = -1; v->eq = 0; v->vmem = 0; v->fbs[0] = v->fbs[1] = 0;
            void *usleep    = SYM(G, D, LIBKERNEL_HANDLE, "sceKernelUsleep");
            void *cancel    = SYM(G, D, LIBKERNEL_HANDLE, "scePthreadCancel");
            void *load_mod  = SYM(G, D, LIBKERNEL_HANDLE, "sceKernelLoadStartModule");
            void *alloc_dm  = SYM(G, D, LIBKERNEL_HANDLE, "sceKernelAllocateDirectMemory");
            void *map_dm    = SYM(G, D, LIBKERNEL_HANDLE, "sceKernelMapDirectMemory");
            void *dm_size   = SYM(G, D, LIBKERNEL_HANDLE, "sceKernelGetDirectMemorySize");
            void *create_eq = SYM(G, D, LIBKERNEL_HANDLE, "sceKernelCreateEqueue");
            if (!usleep || !load_mod || !alloc_dm || !map_dm) return -1;
            if (cancel) {
                u64 gs = *(u64 *)(eboot_base + EBOOT_GS_THREAD);
                if (gs) NC(G, cancel, gs, 0,0,0,0,0);
            }
            NC(G, usleep, 300000, 0,0,0,0,0);
            s32 vid_mod = (s32)NC(G, load_mod, (u64)"libSceVideoOut.sprx", 0,0,0,0,0);
            if (vid_mod < 0) return -2;
            v->vid_open  = SYM(G, D, vid_mod, "sceVideoOutOpen");
            v->vid_close = SYM(G, D, vid_mod, "sceVideoOutClose");
            v->vid_reg   = SYM(G, D, vid_mod, "sceVideoOutRegisterBuffers");
            v->vid_flip  = SYM(G, D, vid_mod, "sceVideoOutSubmitFlip");
            v->vid_rate  = SYM(G, D, vid_mod, "sceVideoOutSetFlipRate");
            v->vid_evt   = SYM(G, D, vid_mod, "sceVideoOutAddFlipEvent");
            if (!v->vid_open || !v->vid_close || !v->vid_reg || !v->vid_flip) return -3;
            s32 emu_vid = *(s32 *)(eboot_base + EBOOT_VIDOUT);
            if (v->vid_close && emu_vid >= 0) NC(G, v->vid_close, (u64)emu_vid, 0,0,0,0,0);
            NC(G, usleep, 100000, 0,0,0,0,0);
            v->handle = (s32)NC(G, v->vid_open, 0xFF, 0, 0, 0, 0, 0);
            if (v->handle < 0) return -4;
            if (create_eq) NC(G, create_eq, (u64)&v->eq, (u64)"vidq", 0,0,0,0);
            if (v->vid_evt && v->eq) NC(G, v->vid_evt, v->eq, (u64)v->handle, 0,0,0,0);
            u64 mem_total = dm_size ? NC(G, dm_size, 0,0,0,0,0,0) : 0x300000000ULL;
            u64 phys = 0;
            NC(G, alloc_dm, 0, mem_total, FB_TOTAL, 0x200000, 3, (u64)&phys);
            NC(G, map_dm, (u64)&v->vmem, FB_TOTAL, 0x33, 0, phys, 0x200000);
            if (!v->vmem) {
                if (v->vid_close) NC(G, v->vid_close, (u64)v->handle, 0,0,0,0,0);
                return -5;
            }
            u32 *fb0 = (u32*)v->vmem;
            u32 *fb1 = (u32*)((u8*)v->vmem + FB_ALIGNED);
            for (int i = 0; i < SCR_W * SCR_H; i++) { fb0[i] = 0xFF000000; fb1[i] = 0xFF000000; }
            u8 attr[64] = {0};
            *(u32*)(attr + 0)  = 0x80000000;
            *(u32*)(attr + 4)  = 1;
            *(u32*)(attr + 12) = SCR_W;
            *(u32*)(attr + 16) = SCR_H;
            *(u32*)(attr + 20) = SCR_W;
            v->fbs[0] = fb0;
            v->fbs[1] = fb1;
            if (NC(G, v->vid_reg, (u64)v->handle, 0, (u64)v->fbs, 2, (u64)attr, 0) != 0) {
                if (v->vid_close) NC(G, v->vid_close, (u64)v->handle, 0,0,0,0,0);
                return -6;
            }
            if (v->vid_rate) NC(G, v->vid_rate, (u64)v->handle, 0, 0,0,0,0);
            return 0;
        }
        void video_cleanup(struct video_ctx *v) {
            if (!v->G) return;
            void *usleep = SYM(v->G, v->D, LIBKERNEL_HANDLE, "sceKernelUsleep");
            void *delete_eq = SYM(v->G, v->D, LIBKERNEL_HANDLE, "sceKernelDeleteEqueue");
            if (v->fbs[0]) {
                u32 *fb = (u32*)v->fbs[0];
                for (int i = 0; i < SCR_W * SCR_H; i++) fb[i] = 0xFF000000;
            }
            if (v->fbs[1]) {
                u32 *fb = (u32*)v->fbs[1];
                for (int i = 0; i < SCR_W * SCR_H; i++) fb[i] = 0xFF000000;
            }
            if (v->vid_flip && v->handle >= 0)
                NC(v->G, v->vid_flip, (u64)v->handle, 0, 1, 0, 0, 0);
            if (usleep) NC(v->G, usleep, 50000, 0,0,0,0,0);
            if (v->vid_close && v->handle >= 0)
                NC(v->G, v->vid_close, (u64)v->handle, 0,0,0,0,0);
            if (v->eq && delete_eq)
                NC(v->G, delete_eq, v->eq, 0,0,0,0,0);
        }
        void video_flip(struct video_ctx *v, int active) {
            if (!v->vid_flip || v->handle < 0) return;
            NC(v->G, v->vid_flip, (u64)v->handle, (u64)active, 1, 0, 0, 0);
            if (v->eq) {
                void *wait_eq = SYM(v->G, v->D, LIBKERNEL_HANDLE, "sceKernelWaitEqueue");
                if (wait_eq) {
                    u8 evt[64]; s32 cnt = 0;
                    NC(v->G, wait_eq, v->eq, (u64)evt, 1, (u64)&cnt, 0, 0);
                }
            }
        }
        EOF

        # -----------------------------------------------------------------
        # audio.h – unchanged
        cat > src/audio.h << 'EOF'
        #ifndef AUDIO_H
        #define AUDIO_H
        #include "core.h"
        #define SAMPLE_RATE     48000
        #define SAMPLES_PER_BUF 256
        #define AUDIO_S16_STEREO 1
        struct audio_ctx {
            void *G, *D;
            void *aud_open, *aud_out, *aud_close;
            s32 handle;
            s16 *buffer;
        };
        int audio_init(struct audio_ctx *a, void *G, void *D);
        void audio_submit(struct audio_ctx *a, const s16 *samples, int count);
        void audio_cleanup(struct audio_ctx *a);
        #endif
        EOF

        # -----------------------------------------------------------------
        # audio.c – unchanged
        cat > src/audio.c << 'EOF'
        #include "audio.h"
        int audio_init(struct audio_ctx *a, void *G, void *D) {
            a->G = G; a->D = D;
            a->handle = -1;
            a->buffer = NULL;
            void *load_mod = SYM(G, D, LIBKERNEL_HANDLE, "sceKernelLoadStartModule");
            s32 aud_mod = (s32)NC(G, load_mod, (u64)"libSceAudioOut.sprx", 0,0,0,0,0);
            if (aud_mod < 0) return -1;
            a->aud_open  = SYM(G, D, aud_mod, "sceAudioOutOpen");
            a->aud_out   = SYM(G, D, aud_mod, "sceAudioOutOutput");
            a->aud_close = SYM(G, D, aud_mod, "sceAudioOutClose");
            if (!a->aud_open || !a->aud_out || !a->aud_close) return -2;
            a->handle = (s32)NC(G, a->aud_open, 0xFF, 0, 0, SAMPLES_PER_BUF, SAMPLE_RATE, AUDIO_S16_STEREO);
            if (a->handle < 0) return -3;
            a->buffer = (s16*)NC(G, SYM(G, D, LIBKERNEL_HANDLE, "malloc"), SAMPLES_PER_BUF * 2 * sizeof(s16), 0,0,0,0,0);
            if (!a->buffer) return -4;
            return 0;
        }
        void audio_submit(struct audio_ctx *a, const s16 *samples, int count) {
            if (!a->aud_out || a->handle < 0 || !a->buffer) return;
            int remaining = count;
            int offset = 0;
            while (remaining > 0) {
                int chunk = remaining < SAMPLES_PER_BUF ? remaining : SAMPLES_PER_BUF;
                NC(a->G, a->aud_out, (u64)a->handle, (u64)(samples + offset), 0, 0, 0, 0);
                remaining -= chunk;
                offset += chunk;
            }
        }
        void audio_cleanup(struct audio_ctx *a) {
            if (a->aud_close && a->handle >= 0)
                NC(a->G, a->aud_close, (u64)a->handle, 0,0,0,0,0);
            if (a->buffer) {
                void *free_fn = SYM(a->G, a->D, LIBKERNEL_HANDLE, "free");
                if (free_fn) NC(a->G, free_fn, (u64)a->buffer, 0,0,0,0,0);
                a->buffer = NULL;
            }
        }
        EOF

        # -----------------------------------------------------------------
        # input.h – unchanged
        cat > src/input.h << 'EOF'
        #ifndef INPUT_H
        #define INPUT_H
        #include "core.h"
        #define DOOM_BTN_UP     0x01
        #define DOOM_BTN_DOWN   0x02
        #define DOOM_BTN_LEFT   0x04
        #define DOOM_BTN_RIGHT  0x08
        #define DOOM_BTN_SHOOT  0x10
        #define DOOM_BTN_USE    0x20
        #define DOOM_BTN_WEAPON 0x40
        #define DOOM_BTN_MENU   0x80
        #define DOOM_BTN_EXIT   0x100
        struct input_ctx {
            void *G, *D;
            void *pad_init, *pad_geth, *pad_read;
            s32 pad_h;
            u32 state;
            u32 web_state;
            s32 web_fd;
            s32 web_client;
            u8 *web_page;
            u64 web_page_len;
        };
        int input_init(struct input_ctx *in, void *G, void *D, u64 eboot_base, struct ext_args *ext);
        void input_poll(struct input_ctx *in);
        u32 input_get_state(struct input_ctx *in);
        void input_cleanup(struct input_ctx *in);
        #endif
        EOF

        # -----------------------------------------------------------------
        # input.c – unchanged
        cat > src/input.c << 'EOF'
        #include "input.h"
        static u32 ds4_to_doom(u32 ds4_buttons) {
            u32 r = 0;
            if (ds4_buttons & 0x00000010) r |= DOOM_BTN_UP;
            if (ds4_buttons & 0x00000040) r |= DOOM_BTN_DOWN;
            if (ds4_buttons & 0x00000080) r |= DOOM_BTN_LEFT;
            if (ds4_buttons & 0x00000020) r |= DOOM_BTN_RIGHT;
            if (ds4_buttons & 0x00004000) r |= DOOM_BTN_SHOOT;
            if (ds4_buttons & 0x00008000) r |= DOOM_BTN_USE;
            if (ds4_buttons & 0x00001000) r |= DOOM_BTN_WEAPON;
            if (ds4_buttons & 0x00002000) r |= DOOM_BTN_MENU;
            if (ds4_buttons & 0x00000008) r |= DOOM_BTN_MENU;
            if (ds4_buttons & 0x00000800) r |= DOOM_BTN_EXIT;
            return r;
        }
        int input_init(struct input_ctx *in, void *G, void *D, u64 eboot_base, struct ext_args *ext) {
            in->G = G; in->D = D;
            in->pad_h = -1;
            in->state = 0;
            in->web_state = 0;
            in->web_fd = -1;
            in->web_client = -1;
            in->web_page = (u8*)ext->dbg[1];
            in->web_page_len = ext->dbg[2];
            void *load_mod = SYM(G, D, LIBKERNEL_HANDLE, "sceKernelLoadStartModule");
            s32 pad_mod = (s32)NC(G, load_mod, (u64)"libScePad.sprx", 0,0,0,0,0);
            if (pad_mod < 0) return -1;
            in->pad_init = SYM(G, D, pad_mod, "scePadInit");
            in->pad_geth = SYM(G, D, pad_mod, "scePadGetHandle");
            in->pad_read = SYM(G, D, pad_mod, "scePadRead");
            if (in->pad_init) NC(G, in->pad_init, 0,0,0,0,0,0);
            if (in->pad_geth) in->pad_h = (s32)NC(G, in->pad_geth, (u64)ext->dbg[3], 0,0,0,0,0);
            return 0;
        }
        void input_poll(struct input_ctx *in) {
            u32 combined = 0;
            if (in->pad_h >= 0 && in->pad_read) {
                u8 pad_buf[128] = {0};
                s32 n = (s32)NC(in->G, in->pad_read, (u64)in->pad_h, (u64)pad_buf, 1, 0, 0, 0);
                if (n > 0 && (u32)n < 0x80000000) {
                    u32 raw = *(u32*)pad_buf;
                    if (!(raw & 0x80000000))
                        combined |= ds4_to_doom(raw & 0x001FFFFF);
                }
            }
            combined |= in->web_state;
            in->state = combined;
        }
        u32 input_get_state(struct input_ctx *in) {
            return in->state;
        }
        void input_cleanup(struct input_ctx *in) {
            if (in->web_client >= 0) {
                void *close = SYM(in->G, in->D, LIBKERNEL_HANDLE, "close");
                if (close) NC(in->G, close, (u64)in->web_client, 0,0,0,0,0);
                in->web_client = -1;
            }
            if (in->web_fd >= 0) {
                void *close = SYM(in->G, in->D, LIBKERNEL_HANDLE, "close");
                if (close) NC(in->G, close, (u64)in->web_fd, 0,0,0,0,0);
                in->web_fd = -1;
            }
        }
        EOF

