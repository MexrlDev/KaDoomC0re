name: Build DoomC0re

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          make \
          python3 \
          xxd \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libsdl2-dev \
          libsdl2-mixer-dev \
          libsdl2-net-dev \
          gcc-x86-64-linux-gnu \
          binutils-x86-64-linux-gnu
        sudo ln -sf /usr/bin/x86_64-linux-gnu-gcc /usr/local/bin/x86_64-elf-gcc
        sudo ln -sf /usr/bin/x86_64-linux-gnu-ld /usr/local/bin/x86_64-elf-ld
        sudo ln -sf /usr/bin/x86_64-linux-gnu-objcopy /usr/local/bin/x86_64-elf-objcopy

    - name: Clone and configure Chocolate Doom (for headers)
      run: |
        git clone https://github.com/chocolate-doom/chocolate-doom.git third_party/chocolate-doom
        cd third_party/chocolate-doom
        ./autogen.sh
        ./configure --prefix=/usr --disable-shared --enable-static
        make config.h
        rm -rf src/heretic src/hexen src/strife

    - name: Write stub_libc.c (with stdout & stderr)
      run: |
        cat > src/stub_libc.c << 'EOF'
        #include <stddef.h>
        #include <stdarg.h>
        #include <stdio.h>

        // Define missing types
        typedef long ssize_t;
        typedef long off_t;

        // Provide stdout and stderr (used by deh_str.c and w_file_posix.c)
        FILE *stdout = NULL;
        FILE *stderr = NULL;

        // ----- Memory / string functions -----
        void *memcpy(void *dest, const void *src, size_t n) {
            unsigned char *d = dest;
            const unsigned char *s = src;
            while (n--) *d++ = *s++;
            return dest;
        }
        void *memset(void *s, int c, size_t n) {
            unsigned char *p = s;
            while (n--) *p++ = (unsigned char)c;
            return s;
        }
        void *memmove(void *dest, const void *src, size_t n) {
            unsigned char *d = dest;
            const unsigned char *s = src;
            if (d < s) {
                while (n--) *d++ = *s++;
            } else {
                d += n; s += n;
                while (n--) *--d = *--s;
            }
            return dest;
        }
        size_t strlen(const char *s) {
            size_t n = 0;
            while (*s++) n++;
            return n;
        }
        int strcmp(const char *a, const char *b) {
            while (*a && *a == *b) { a++; b++; }
            return *(unsigned char*)a - *(unsigned char*)b;
        }
        int strncmp(const char *a, const char *b, size_t n) {
            while (n-- && *a && *a == *b) { a++; b++; }
            if (!n) return 0;
            return *(unsigned char*)a - *(unsigned char*)b;
        }
        char *strcpy(char *dest, const char *src) {
            char *d = dest;
            while ((*d++ = *src++));
            return dest;
        }
        char *strncpy(char *dest, const char *src, size_t n) {
            char *d = dest;
            while (n-- && (*d++ = *src++));
            return dest;
        }
        char *strchr(const char *s, int c) {
            while (*s) {
                if (*s == c) return (char*)s;
                s++;
            }
            return NULL;
        }
        char *strrchr(const char *s, int c) {
            const char *last = NULL;
            while (*s) {
                if (*s == c) last = s;
                s++;
            }
            return (char*)last;
        }
        char *strstr(const char *haystack, const char *needle) {
            for (; *haystack; haystack++) {
                const char *h = haystack, *n = needle;
                while (*h && *n && *h == *n) { h++; n++; }
                if (!*n) return (char*)haystack;
            }
            return NULL;
        }
        int strcasecmp(const char *a, const char *b) {
            while (*a && *b && (*a | 0x20) == (*b | 0x20)) { a++; b++; }
            return (*a | 0x20) - (*b | 0x20);
        }
        int strncasecmp(const char *a, const char *b, size_t n) {
            while (n-- && *a && *b && (*a | 0x20) == (*b | 0x20)) { a++; b++; }
            if (!n) return 0;
            return (*a | 0x20) - (*b | 0x20);
        }
        char *strdup(const char *s) { return NULL; }

        // ----- stdio stubs (no-ops) -----
        int printf(const char *fmt, ...) { return 0; }
        int puts(const char *s) { return 0; }
        void exit(int status) { while (1); }
        void *malloc(size_t size) { return NULL; }
        void free(void *ptr) {}
        void *calloc(size_t nmemb, size_t size) { return NULL; }
        void *realloc(void *ptr, size_t size) { return NULL; }
        int getchar(void) { return EOF; }
        int feof(FILE *stream) { return 0; }
        int fgetc(FILE *stream) { return EOF; }
        int ungetc(int c, FILE *stream) { return c; }
        FILE *fopen(const char *path, const char *mode) { return NULL; }
        size_t fread(void *ptr, size_t size, size_t nmemb, FILE *stream) { return 0; }
        size_t fwrite(const void *ptr, size_t size, size_t nmemb, FILE *stream) { return 0; }
        int fclose(FILE *stream) { return 0; }
        int fseek(FILE *stream, long offset, int whence) { return 0; }
        long ftell(FILE *stream) { return 0; }
        int remove(const char *path) { return 0; }
        int rename(const char *old, const char *new) { return 0; }
        int mkdir(const char *path, int mode) { return 0; }
        void *opendir(const char *path) { return NULL; }
        void *readdir(void *dir) { return NULL; }
        int closedir(void *dir) { return 0; }
        int stat(const char *path, void *buf) { return 0; }
        char *getenv(const char *name) { return NULL; }
        int __errno_location(void) { static int err; return err; }
        void *localeconv(void) { static void *dummy; return dummy; }
        double strtod(const char *nptr, char **endptr) { return 0.0; }
        long strtol(const char *nptr, char **endptr, int base) { return 0; }
        int __isoc99_sscanf(const char *str, const char *format, ...) { return 0; }
        int __isoc99_fscanf(FILE *stream, const char *format, ...) { return 0; }
        int __printf_chk(int flag, const char *format, ...) { return 0; }
        int __fprintf_chk(FILE *stream, int flag, const char *format, ...) { return 0; }
        int __vfprintf_chk(FILE *stream, int flag, const char *format, va_list ap) { return 0; }
        int __vsnprintf_chk(char *str, size_t size, int flag, size_t slen, const char *format, va_list ap) { return 0; }
        size_t __fread_chk(void *ptr, size_t ptrlen, size_t size, size_t nmemb, FILE *stream) { return 0; }
        void *__memset_chk(void *dest, int c, size_t len, size_t destlen) { return memset(dest, c, len); }
        char *__strncpy_chk(char *dest, const char *src, size_t n, size_t destlen) { return strncpy(dest, src, n); }
        unsigned short *__ctype_b_loc(void) { static unsigned short ctype[256]; return ctype; }
        unsigned short *__ctype_toupper_loc(void) { static unsigned short toupper[256]; return toupper; }
        unsigned short *__ctype_tolower_loc(void) { static unsigned short tolower[256]; return tolower; }
        int __assert_fail(const char *assertion, const char *file, unsigned int line, const char *function) { while (1); }

        // ----- POSIX-like stubs -----
        int open(const char *path, int flags, ...) { return -1; }
        int close(int fd) { return 0; }
        ssize_t read(int fd, void *buf, size_t count) { return -1; }
        ssize_t write(int fd, const void *buf, size_t count) { return count; }
        void *mmap(void *addr, size_t len, int prot, int flags, int fd, off_t offset) { return NULL; }
        int munmap(void *addr, size_t len) { return 0; }
        off_t lseek(int fd, off_t offset, int whence) { return 0; }
        char *strerror(int errnum) { return "Unknown error"; }
        void perror(const char *s) {}
        EOF

    - name: Write doom_stubs.c (minimal)
      run: |
        cat > src/doom_stubs.c << 'EOF'
        #include <stddef.h>

        // Variables used by the engine
        int usemouse = 0;
        int mouse_threshold = 0;
        int mouse_acceleration = 0;
        void *I_VideoBuffer = NULL;

        // Stubs for missing functions
        void *I_Realloc(void *ptr, size_t size) {
            extern void *realloc(void *, size_t);
            return realloc(ptr, size);
        }

        int I_GetPaletteIndex(int color) {
            return 0;
        }

        void V_BeginRead(void) {
        }

        int M_CheckParm(const char *parm) {
            return 0;
        }
        EOF

    - name: Write updated Makefile (exclude all problematic files)
      run: |
        cat > Makefile << 'EOF'
        CC = x86_64-elf-gcc
        LD = x86_64-elf-ld
        OBJCOPY = x86_64-elf-objcopy
        CFLAGS = -nostdlib -fno-stack-protector -fPIC -O2 -I. -Wall -Ithird_party/chocolate-doom/src -Ithird_party/chocolate-doom -I/usr/include/SDL2 -DHAVE_CONFIG_H
        LDFLAGS = -T linker.ld

        # Our source files
        SRC_FILES = src/hijack.c src/audio.c src/input.c src/ui.c src/ftp_server.c src/i_ps.c src/doom_engine.c src/doom_main.c src/stub_libc.c src/doom_stubs.c
        OBJS = $(SRC_FILES:src/%.c=%.o)

        # Chocolate Doom sources
        DOOM_SRC_DIR = third_party/chocolate-doom/src
        DOOM_SRC_FILES = $(wildcard $(DOOM_SRC_DIR)/*.c)

        # Exclude everything that is not needed
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/d_dedicated.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/d_loop.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/d_iwad.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/deh_io.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/deh_main.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/deh_mapping.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/m_config.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/m_controls.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/m_argv.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_glob.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/memio.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/mus2mid.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/midi%.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/w_main.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/w_merge.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/w_checksum.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/z_zone.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_sound.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_video.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_input.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_system.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_main.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/p_rejectpad.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_endoom.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/txt_%.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/net_%.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_sdlmusic.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_sdlsound.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_oplmusic.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_flmusic.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_musicpack.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_cdmus.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/gusconf.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_midipipe.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_midifile.c, $(DOOM_SRC_FILES))
        # Additional problematic files
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_joystick.c, $(DOOM_SRC_FILES))   # <-- added
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_pcsound.c, $(DOOM_SRC_FILES))    # <-- added
        # Also exclude i_videohr.c, i_winmusic.c, etc. if they appear
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_videohr.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/i_winmusic.c, $(DOOM_SRC_FILES))
        DOOM_SRC_FILES := $(filter-out $(DOOM_SRC_DIR)/w_file_win32.c, $(DOOM_SRC_FILES))

        DOOM_OBJS = $(DOOM_SRC_FILES:$(DOOM_SRC_DIR)/%.c=doom_%.o)

        all: doom.bin

        %.o: src/%.c
        	$(CC) $(CFLAGS) -c $< -o $@

        doom_%.o: $(DOOM_SRC_DIR)/%.c
        	$(CC) $(CFLAGS) -c $< -o $@

        doom.elf: $(OBJS) $(DOOM_OBJS)
        	$(LD) $(LDFLAGS) -o $@ $^

        doom.bin: doom.elf
        	$(OBJCOPY) -O binary $< $@

        clean:
        	rm -f *.o doom.elf doom.bin

        .PHONY: all clean
        EOF

    - name: Build DoomC0re
      run: |
        echo "Building DoomC0re..."
        make
        echo "Build complete!"

    - name: Verify outputs
      run: |
        ls -lah
        file doom.elf doom.bin || true
        wc -c doom.bin

    - name: Convert doom.bin to Lua hex
      run: |
        python3 -c "
        with open('doom.bin', 'rb') as f:
            data = f.read()
        hex_str = data.hex().upper()
        lines = [hex_str[i:i+64] for i in range(0, len(hex_str), 64)]
        lua_str = '\"' + '\"\n\"'.join(lines) + '\"'
        with open('doom_hex.txt', 'w') as f:
            f.write(lua_str)
        "
        echo "Hex string length: $(wc -c < doom_hex.txt) characters"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DoomC0re-Build
        path: |
          doom.bin
          doom.elf
          doom_hex.txt
          lua/doom.lua
          tools/convert_to_hex.py
          tools/send_lua.py
          linker.ld
          Makefile
          src/
        if-no-files-found: error
