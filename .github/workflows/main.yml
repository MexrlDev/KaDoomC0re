            {0x7C,0x42,0x42,0x7C,0x40,0x40,0x00,0x00},
            {0x3C,0x42,0x42,0x4A,0x44,0x3A,0x00,0x00},
            {0x7C,0x42,0x42,0x7C,0x44,0x42,0x00,0x00},
            {0x3C,0x40,0x3C,0x02,0x42,0x3C,0x00,0x00},
            {0x7E,0x18,0x18,0x18,0x18,0x18,0x00,0x00},
            {0x42,0x42,0x42,0x42,0x42,0x3C,0x00,0x00},
            {0x42,0x42,0x42,0x42,0x24,0x18,0x00,0x00},
            {0x42,0x42,0x42,0x5A,0x66,0x42,0x00,0x00},
            {0x42,0x24,0x18,0x18,0x24,0x42,0x00,0x00},
            {0x42,0x42,0x24,0x18,0x18,0x18,0x00,0x00},
            {0x7E,0x04,0x08,0x10,0x20,0x7E,0x00,0x00},
        };
        void ui_clear_fb(u32 *fb, u32 color) {
            for (int i = 0; i < SCR_W * SCR_H; i++) fb[i] = color;
        }
        void ui_draw_char_scaled(u32 *fb, int x, int y, char ch, int scale, u32 color) {
            int idx = 0;
            if (ch >= 'a' && ch <= 'z') ch -= 32;
            if (ch >= 32 && ch <= 90) idx = ch - 32;
            else idx = 0;
            const u8 *glyph = font_data[idx];
            for (int r = 0; r < 8; r++) {
                u8 bits = glyph[r];
                for (int c = 0; c < 8; c++) {
                    if (bits & (0x80 >> c)) {
                        int base_x = x + c * scale;
                        int base_y = y + r * scale;
                        for (int dy = 0; dy < scale; dy++) {
                            u32 *row = &fb[(base_y + dy) * SCR_W + base_x];
                            for (int dx = 0; dx < scale; dx++) {
                                row[dx] = color;
                            }
                        }
                    }
                }
            }
        }
        void ui_draw_text_scaled(u32 *fb, const char *s, int scale, u32 color, int y_pos) {
            int len = ui_str_len(s);
            int total_w = len * (8 * scale);
            int x = (SCR_W - total_w) / 2;
            int y = y_pos;
            while (*s) {
                ui_draw_char_scaled(fb, x, y, *s, scale, color);
                x += 8 * scale;
                s++;
            }
        }
        void ui_draw_str(u32 *fb, int x, int y, const char *s, u32 color) {
            while (*s) {
                ui_draw_char_scaled(fb, x, y, *s, 2, color);
                x += 16;
                s++;
            }
        }
        int ui_str_len(const char *s) {
            int n = 0;
            while (*s++) n++;
            return n;
        }
        EOF

